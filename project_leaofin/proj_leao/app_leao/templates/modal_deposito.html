<!-- CONTAINER PRINCIPAL DO MODAL -->
<div id="depositModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4 overflow-y-auto">
    <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-lg transform transition-all">
        
        <!-- Header -->
        <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center rounded-t-xl">
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                <i data-lucide="building-bank" class="w-4 h-4 text-slate-500"></i> Registrar Novo Depósito
            </h3>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-200 transition-colors cursor-pointer">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- FORMULÁRIO MANUAL EM HTML -->
        <form method="POST" enctype="multipart/form-data" action="{% url 'deposito' %}" class="p-6 space-y-4">
            {% csrf_token %}

            <!-- Input: Unidade / Filial -->
            <div>
                <label for="unidade" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Unidade / Filial</label>
                <select id="unidade" name="unidade" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 text-sm bg-white">
                    <option value="" disabled selected>Selecione a unidade...</option>
                    {% for item in saldos %}
                        <option value="{{ item.unidade }}">{{ item.unidade }}</option>
                    {% empty %}
                        <option value="AEROPORTO"> AEROPORTO </option>
                        <option value="CASTANHEIRA"> CASTANHEIRA </option>
                        <option value="BAENÃO">BAENÃO </option>
                        <option value="PÁTIO">PÁTIO</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Grid: Data e Valor -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="data_deposito" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Data do Depósito</label>
                    <input type="date" id="data_deposito" name="data_deposito" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 text-sm">
                </div>
                <div>
                    <label for="valor" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Valor (R$)</label>
                    <input type="number" step="0.01" id="valor" name="valor" placeholder="0.00" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 text-sm font-mono">
                </div>
            </div>

            <!-- Input: Destino -->
            <div>
                <label for="destino" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Destino</label>
                <select id="destino" name="destino" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 text-sm bg-white">
                    {% for item in bancos %}
                        <option value="{{ item.nome }}">{{ item.nome }}</option>
                    {% empty %}
                        <option value="Definir"> Definir </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Input: Comprovante -->
            <div>
                <label for="comprovante" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Comprovante (opcional)</label>
                <input type="file" id="comprovante" name="comprovante" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer">
            </div>

            <!-- Input: Observação -->
            <div>
                <label for="observacao" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Observações</label>
                <textarea id="observacao" name="observacao" rows="2" placeholder="Observações adicionais..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 text-sm"></textarea>
            </div>

            <!-- Footer / Botões -->
            <div class="pt-4 border-t border-slate-100 flex justify-end gap-3">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors cursor-pointer">
                    Cancelar
                </button>
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-slate-900 hover:bg-slate-800 rounded-lg shadow-sm transition-colors cursor-pointer">
                    Salvar Depósito
                </button>
            </div>
        </form>
    </div>
</div>

<!-- SCRIPT DE ABERTURA E FECHAMENTO -->
<script>
    function openModal() {
        const modal = document.getElementById('depositModal');
        if (modal) {
            modal.classList.remove('hidden');
        }
    }

    function closeModal() {
        const modal = document.getElementById('depositModal');
        if (modal) {
            modal.classList.add('hidden');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('depositModal');
        if (modal) {
            modal.addEventListener('click', function(event) {
                if (event.target === modal) {
                    closeModal();
                }
            });
        }
    });
</script>
