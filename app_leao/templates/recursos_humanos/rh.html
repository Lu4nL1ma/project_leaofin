<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Upload Manual - Google Drive</title>
    <style>
        body { font-family: sans-serif; max-width: 550px; margin: 40px auto; padding: 0 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input[type="text"], input[type="file"] { 
            width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; 
        }
        button { 
            background: #007bff; color: white; padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; 
        }
        button:hover { background: #0056b3; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .alert-success { background-color: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Novo Upload</h2>

    <!-- Exibição de mensagens de erro/sucesso do Django Messages -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'upload_form' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_title">Título do Arquivo</label>
            <input type="text" id="id_title" name="title" placeholder="Ex: Relatório Financeiro Q3" required>
        </div>

        <div class="form-group">
            <label for="id_file">Selecione o Arquivo</label>
            <input type="file" id="id_file" name="file" required>
        </div>

        <button type="submit">Enviar para o Drive</button>
        <a href="{% url 'file_list' %}" style="margin-left: 10px; text-decoration: none; color: #666;">Ver lista</a>
    </form>

</body>
</html>
