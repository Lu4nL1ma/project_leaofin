<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consolidador de Extratos OFX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md border border-slate-200 p-8">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Consolidação Multi-Extrato (Até 5 Contas)</h1>
            <p class="text-sm text-slate-500 mt-1">
                Envie os arquivos OFX para consolidar as movimentações em uma única base e totalizar os saldos de cada conta.
            </p>
        </div>

        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="p-4 text-sm rounded-lg {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="border border-slate-200 rounded-lg p-3 bg-slate-50">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Extrato Conta 1 <span class="text-red-500">*</span></label>
                    <input type="file" name="ofx_1" accept=".ofx" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 w-full" required />
                </div>

                <div class="border border-slate-200 rounded-lg p-3 bg-slate-50">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Extrato Conta 2</label>
                    <input type="file" name="ofx_2" accept=".ofx" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 w-full" />
                </div>

                <div class="border border-slate-200 rounded-lg p-3 bg-slate-50">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Extrato Conta 3</label>
                    <input type="file" name="ofx_3" accept=".ofx" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 w-full" />
                </div>

                <div class="border border-slate-200 rounded-lg p-3 bg-slate-50">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Extrato Conta 4</label>
                    <input type="file" name="ofx_4" accept=".ofx" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 w-full" />
                </div>

                <div class="border border-slate-200 rounded-lg p-3 bg-slate-50 md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Extrato Conta 5</label>
                    <input type="file" name="ofx_5" accept=".ofx" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 w-full" />
                </div>
            </div>

            <div class="pt-4 border-t border-slate-100 flex justify-end">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg text-sm transition-colors shadow-sm inline-flex items-center">
                    Gerar e Baixar Planilha Consolidada
                </button>
            </div>
        </form>
    </div>

</body>
</html>
